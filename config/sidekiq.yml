:concurrency: 5
:queues:
  - default

# Recurring jobs (sidekiq-scheduler). Run with: bundle exec sidekiq
:scheduler:
  :schedule:
    polymarket_sync:
      every: "5m"
      class: PolymarketSyncJob
      queue: default
      description: "Fetch markets from Polymarket API"
    clarification_detector:
      every: "2h"
      class: ClarificationDetectorJob
      queue: default
      description: "Detect resolution criteria changes and create clarifications"
    uma_dispute_ingest:
      every: "6h"
      class: UmaDisputeIngestJob
      queue: default
      description: "Ingest UMA dispute data and build category dispute rates"
    risk_score_calculation:
      every: "30m"
      class: RiskScoreCalculationJob
      queue: default
      description: "Recalculate risk scores for markets needing scoring"