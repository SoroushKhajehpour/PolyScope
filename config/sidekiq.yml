:concurrency: 5
:queues:
  - default

# Recurring jobs (sidekiq-scheduler). Run with: bundle exec sidekiq
:scheduler:
  :schedule:
    polymarket_sync:
      every: "5m"
      class: PolymarketSyncJob
      queue: default
      description: "Fetch markets from Polymarket API"
    clarification_detector:
      every: "2h"
      class: ClarificationDetectorJob
      queue: default
      description: "Detect resolution criteria changes and create clarifications"